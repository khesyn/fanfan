<style>
:root{--ink:#1F3A6B;--cream:#FAF6EA;--soft:#5B6F95;--line:#D5CCB4;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);--df:#1F3A6B;--dl:#FAF6EA;--secH:clamp(430px,calc(100vh - 300px),500px)}

*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#EFE7D3}
body{font-family:ui-rounded,"SF Pro Rounded",Nunito,"Hiragino Maru Gothic ProN","PingFang SC","Noto Sans SC",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

.hide{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;z-index:0;background:#EFE7D3;transition:filter .45s}

.leaflet-control-attribution{font-size:9.5px!important;background:#FFFBF1aa!important;color:#6b6350!important}

.view-on #map{filter:blur(7px) saturate(.85)}
#dim{position:absolute;inset:0;z-index:2;background:#F3EAD4;opacity:0;transition:opacity .45s;pointer-events:none}
.view-on #dim{opacity:.45;pointer-events:auto}
#ringsvg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;transition:opacity .3s}
.view-on #ringsvg{opacity:0}
#top{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 12px);z-index:8;display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--ink);border:1.5px solid var(--ink);border-radius:99px;padding:7px 14px;background:#FFFBF1ee;box-shadow:0 2px 8px #3a2c1422;position:relative;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .bd{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:var(--cream);font-size:10px;line-height:16px;text-align:center;padding:0 4px}

#search{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 60px);z-index:9;background:#FFFBF1f4;border-radius:18px;padding:14px;box-shadow:0 8px 24px #3a2c1440;max-height:calc(100% - var(--sat) - 90px);overflow:auto}
.srow{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.sbtn{background:var(--ink);color:var(--cream);border-radius:12px;padding:0 16px;font-weight:800;font-size:14px}
.res{margin-top:8px;display:flex;flex-direction:column}
.res button{text-align:left;padding:9px 6px;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.35}
.res button small{display:block;color:var(--soft);font-size:11.5px}
.res .msg2{padding:8px 6px;color:var(--soft);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{border:1.5px solid var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;background:#fff}
.chip[aria-pressed=true]{background:var(--ink);color:var(--cream)}
.sl{font-size:12px;color:var(--soft);font-weight:700;margin-top:12px}
.sfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.sfoot small{font-size:10.5px;color:var(--soft);line-height:1.4;flex:1}
.link{font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:4px;padding:6px}
/* 碗按钮 */
#dial{position:absolute;left:50%;top:50%;width:180px;height:200px;margin:-100px 0 0 -90px;z-index:5;pointer-events:none;transition:opacity .3s}
.view-on #dial,.view-on #msg{opacity:0;pointer-events:none!important}
.view-on #msg>*{pointer-events:none!important}
.bob{position:absolute;inset:0;animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.shadow{position:absolute;left:56px;top:166px;width:68px;height:12px;border-radius:50%;background:#1F3A6B2e}
.rpl{position:absolute;left:36px;top:46px;width:108px;height:108px;border-radius:50%;border:1.6px solid var(--dl2,#1F3A6B);animation:rip 4s ease-out infinite;opacity:0}
.rpl:nth-child(2){animation-delay:1.3s}.rpl:nth-child(3){animation-delay:2.6s}
@keyframes rip{0%{transform:scale(1);opacity:.45}100%{transform:scale(2.4);opacity:0}}
.busy .rpl{display:none}
#disc{position:absolute;left:36px;top:46px;width:108px;height:108px;border-radius:50%;background:var(--df);border:2.4px solid var(--df);pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px #3a2c1440;transition:background .3s,border-color .3s;touch-action:none}
#disc:active{transform:scale(.97)}
.bowl{width:58%;height:auto;fill:none;stroke:var(--dl);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.bw{transform-box:fill-box;transform-origin:50% 100%;animation:wob 8s ease-in-out infinite}
@keyframes wob{0%,26%,100%{transform:rotate(0)}6%{transform:rotate(-7deg)}13%{transform:rotate(6deg)}20%{transform:rotate(-3deg)}}
.dots{display:none;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--dl);animation:jp .9s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes jp{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-9px);opacity:1}}
.busy #disc{background:#FFFBF1;border-color:var(--dl)}
.busy .dots{display:flex}
.busy .bowl{display:none}
#pop{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:0 5px 12px #3a2c1445;pointer-events:auto;transition:transform .12s}
.bub.on{transform:scale(1.14);box-shadow:0 0 0 3px #fff,0 5px 12px #3a2c1445}
#msg{position:absolute;left:0;right:0;top:calc(50% + 120px);z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;transition:opacity .3s;pointer-events:none}
#msg>*{pointer-events:auto}
.hint{display:inline-block;background:#FFFBF1ee;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700;box-shadow:0 2px 8px #3a2c1422}
.et{font-size:14px;font-weight:800;background:#FFFBF1ee;border-radius:12px;padding:6px 12px 0}
.eb{font-size:12.5px;color:var(--soft);background:#FFFBF1ee;border-radius:0 0 12px 12px;padding:2px 12px 8px;max-width:280px}
#msg .link{background:#FFFBF1ee;border-radius:99px;margin-top:6px;padding:6px 14px}

#view{position:absolute;inset:0;z-index:6;pointer-events:none}
#view>*{pointer-events:auto}
#feed{position:absolute;left:0;right:0;top:0;bottom:calc(183px + var(--sab));overflow:hidden;-webkit-mask-image:linear-gradient(transparent calc(var(--sat) + 60px),#000 calc(var(--sat) + 190px));mask-image:linear-gradient(transparent calc(var(--sat) + 60px),#000 calc(var(--sat) + 190px));touch-action:none}
#strip{position:absolute;left:50%;margin-left:-126px;width:252px;bottom:0;will-change:transform}
.secw{filter:drop-shadow(0 8px 12px #2a1f0f55);transition:opacity .9s}
.sec{position:relative;height:var(--secH);padding:22px 17px 70px;background:#FFFDF6;color:var(--ink);font-family:ui-monospace,"SF Mono","Courier New","PingFang SC",monospace;display:flex;flex-direction:column;overflow:hidden}
.secw+.secw .sec{border-top:2px dashed #9FB0CC}
.sec.zt{clip-path:var(--zt)}.sec.zb{clip-path:var(--zb)}.sec.zt.zb{clip-path:var(--zz)}
.rn{text-align:center;font-family:ui-rounded,Nunito,"PingFang SC",sans-serif;font-size:18px;font-weight:800;line-height:1.25;word-break:break-word}
.re{text-align:center;font-size:10.5px;color:var(--soft);margin-top:2px;min-height:13px;word-break:break-word}
.rd2{border-top:1.5px dashed #9FB0CC;margin:9px 0;flex:none}
.rph{flex:1;min-height:70px;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rph svg{width:70%;max-height:92%;height:auto}
.ri{display:flex;gap:6px;align-items:baseline;font-size:11.5px;margin-top:5px;flex:none}
.ri i{flex:1;border-bottom:1.5px dotted #B9C3D6;transform:translateY(-3px);min-width:8px}
.ri span{flex:none}.ri b{font-weight:700;text-align:right;max-width:70%;word-break:break-word}
.note{font-size:10.5px;color:var(--soft);margin-top:6px;text-align:center}
.bc{height:22px;flex:none;background:repeating-linear-gradient(90deg,#1F3A6B 0 2px,#0000 2px 4px,#1F3A6B 4px 5px,#0000 5px 8px,#1F3A6B 8px 11px,#0000 11px 12px)}
.rno{text-align:center;font-size:10px;color:var(--soft);margin-top:4px;letter-spacing:.1em;flex:none}
.nva{position:absolute;left:50%;bottom:26px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:scale(.5)}
.torn .nva{opacity:1;pointer-events:auto;transform:scale(1);transition:opacity .4s .6s,transform .4s .6s}
.torn .secw[style*="opacity: 0"] .nva{pointer-events:none}
#printer{position:absolute;left:50%;margin-left:-157px;width:314px;height:80px;bottom:calc(144px + var(--sab));pointer-events:none;transition:opacity 1.6s,transform 1.6s}
.torn #printer{opacity:0;transform:translateY(26px)}
.led{animation:led 1s steps(2) infinite}
@keyframes led{0%{opacity:1}50%{opacity:.15}}
#view:not(.printing) .led{animation:none;opacity:.35}
#acts{position:absolute;left:30px;right:30px;bottom:calc(34px + var(--sab));display:flex;flex-direction:column;align-items:center;transition:opacity .5s}
.torn #acts,.printing #acts{opacity:0;pointer-events:none}
.torn #acts{transition:opacity .3s}
.pbtn{display:block;width:100%;padding:14px 8px;background:var(--ink);color:var(--cream);border-radius:14px;font-size:16px;font-weight:800}
.pbtn:active{transform:scale(.985)}
#acts .link{margin-top:8px}
#toast{position:absolute;left:0;right:0;bottom:calc(120px + var(--sab));text-align:center;z-index:9;pointer-events:none}
#toast span{display:inline-block;background:#FFFBF1ee;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:700;box-shadow:0 2px 8px #3a2c1422}
.ill{fill:none;stroke:#1F3A6B;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ill .w{fill:#FFFDF6}.ill .rd{fill:#D8503A}.ill .gr{fill:#8DBB75}.ill .lg{fill:#BFE0A5}.ill .ck{fill:#F3D7A8}.ill .bl{fill:#DCE6F5}.ill .or{fill:#E9963F}.ill .yl{fill:#F2C14E}.ill .pk{fill:#F4A58A}.ill .bn{fill:#C98F4F}
.ill .sh{fill:#1F3A6B;fill-opacity:.08;stroke:none}.ill .ns{stroke:none}.ill .th{stroke-width:1.5}.ill .st{opacity:.45}
@media (prefers-reduced-motion:reduce){.bw,.rpl,.bob,.dots i,.led{animation:none}}
</style>
</head>

const D={Mo:0,Tu:1,We:2,Th:3,Fr:4,Sa:5,Su:6};
const HR=/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?,?\s*)+)?\s*(off|closed|(?:\d{1,2}:\d{2}-\d{1,2}:\d{2}(?:\s*,\s*)?)+)$/;
function days(s){const set=new Set();for(const p of s.split(',')){const m=p.match(/^(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))?$/);if(!m)return null;const a=D[m[1]],b=m[2]?D[m[2]]:a;for(let i=a;;i=(i+1)%7){set.add(i);if(i===b)break}}return set}
function openState(h,now=new Date()){
 if(!h)return{s:null};
 if(h.trim()==='24/7')return{s:true,until:null};
 const dow=(now.getDay()+6)%7,prev=(dow+6)%7,mins=now.getHours()*60+now.getMinutes();
 let ok=false,until=null,parsed=false;
 for(const raw of h.split(';')){
  const r=raw.trim();if(!r)continue;const m=r.match(HR);if(!m)continue;
  const ds=m[1]?days(m[1].replace(/\s/g,'')):new Set([0,1,2,3,4,5,6]);if(!ds)continue;parsed=true;
  if(/^(off|closed)$/.test(m[2])){if(ds.has(dow)){ok=false;until=null}continue}
  for(const t of m[2].split(',')){
   const x=t.trim().match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);if(!x)continue;
   const a=x[1]*60+ +x[2],b=x[3]*60+ +x[4],end=t.trim().split('-')[1];
   if(a<b){if(ds.has(dow)&&mins>=a&&mins<b){ok=true;until=end}}
   else{if(ds.has(dow)&&mins>=a){ok=true;until=end}if(ds.has(prev)&&mins<b){ok=true;until=end}}
  }
 }
 return parsed?{s:ok,until}:{s:null};
}
function todayHours(h,now=new Date()){
 if(!h)return null;if(h.trim()==='24/7')return['24h'];
 const dow=(now.getDay()+6)%7;let r=null;
 for(const raw of h.split(';')){
  const m=raw.trim().match(HR);if(!m)continue;
  const ds=m[1]?days(m[1].replace(/\s/g,'')):new Set([0,1,2,3,4,5,6]);if(!ds||!ds.has(dow))continue;
  r=/^(off|closed)$/.test(m[2])?[]:m[2].split(',').map(x=>x.trim().replace(/\b(\d):/g,'0$1:').replace('-',' - '));
 }

}

function artOf(p){
 let g='plate';
 if(p.court)g='court';
 else if(p.dishId&&DC[p.dishId])g=p.dishId;
 else if(p.cats&&p.cats.includes('tea'))g='tea';
 else if(p.cats&&p.cats.includes('coffee')&&!p.kc)g='coffee';
 else if(p.cats&&p.cats.includes('dessert')&&!p.kc)g='dessert';
 else for(const x in GM)if(GM[x].includes(p.kc))g=x;
 let h=0;for(const c of g)h=(h*31+c.charCodeAt(0))%97;
 return{svg:`<svg class="ill" viewBox="0 0 160 120" aria-hidden="true">${DC[g]}</svg>`,bg:BGS[h%4]};
}

function center(){
 if(S.map){const c=S.map.getCenter();return{lat:c.lat,lon:c.lng}}
 return S.gps||{lat:1.3521,lon:103.8198};
}
const isNearby=()=>{const c=center();return !!S.gps&&km(c.lat,c.lon,S.gps.lat,S.gps.lon)<.3};
function updateRing(){
 if(!S.map)return;
 const c=S.map.getCenter(),z=S.map.getZoom(),mpp=156543.03392*Math.cos(c.lat*Math.PI/180)/Math.pow(2,z);
 $('#ringc').setAttribute('r',Math.max(20,3000/mpp));
}
function shortName(){return S.placeName||L_().mapc}
function refreshLeft(){
 const l=L_(),b=$('#left');b.textContent='';
 if(S.view){b.textContent=l.back;return}
 const pin=document.createElementNS('http://www.w3.org/2000/svg','svg');pin.setAttribute('width','12');pin.setAttribute('height','14');pin.setAttribute('viewBox','0 0 24 24');pin.setAttribute('fill','none');pin.setAttribute('stroke','#1F3A6B');pin.setAttribute('stroke-width','2.4');pin.setAttribute('stroke-linecap','round');pin.setAttribute('stroke-linejoin','round');
 pin.innerHTML='<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>';
 b.append(pin,document.createTextNode(isNearby()?l.near:shortName()));
 if(S.cats.size){const n=document.createElement('span');n.className='bd';n.textContent=S.cats.size;b.append(n)}
}
function initMap(){
 if(typeof L==='undefined')return;
 const m=L.map('map',{zoomControl:false,attributionControl:true,center:[1.3521,103.8198],zoom:13,minZoom:10,maxZoom:18,zoomSnap:.5});
 m.attributionControl.setPrefix(false);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap contributors © CARTO'}).addTo(m);
 m.on('move zoom',updateRing);
 m.on('dragstart',()=>{S.moved=true;closeSearch()});
 m.on('moveend',()=>{if(!S.prog)S.placeName=null;S.prog=false;refreshLeft()});
 S.map=m;updateRing();
}
function flyTo(lat,lon,zoom,name){S.prog=true;S.placeName=name||null;if(S.map)S.map.setView([lat,lon],zoom||13);refreshLeft()}
function locate(){
 if(!navigator.geolocation)return;
 navigator.geolocation.getCurrentPosition(p=>{S.gps={lat:p.coords.latitude,lon:p.coords.longitude};if(S.map&&!S.moved)flyTo(S.gps.lat,S.gps.lon,13,null);refreshLeft()},()=>{},{enableHighAccuracy:true,timeout:12000,maximumAge:120000});
}

function applyTier(){

}
function ccNow(){const c=center();return boxCC(c.lat,c.lon)}
async function refineCC(c){
 try{
  const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=3&lat=${c.lat}&lon=${c.lon}`)).json();
  const cc=((j.address&&j.address.country_code)||'').toLowerCase();
  if(BANDS[cc]&&cc!==S.cc){S.cc=cc;if(S.view)rerender()}
 }catch(e){}
}
function openPop(){
 closePop();S.cc=ccNow();
 const pop=$('#pop');pop.innerHTML='';
 const defs=[['all',-160,null],['low',-115,'low'],['mid',-65,'mid'],['high',-20,'high']],R=120;

  else b.textContent=bandText(S.cc,band,false);

  pop.append(b);
 }
 S.pop=true;showHint('popHint');
}

function renderMsg(){
 const l=L_(),h=$('#hint'),et=$('#et'),eb=$('#eb'),rt=$('#retry');
 [h,et,eb,rt].forEach(x=>x.classList.add('hide'));
 if(S.hint){h.textContent=l[S.hint];h.classList.remove('hide')}
 else if(S.err){et.textContent=l[S.err][0];eb.textContent=l[S.err][1];rt.textContent=l.retry;[et,eb,rt].forEach(x=>x.classList.remove('hide'))}
}

async function doSearch(){
 const q=$('#q').value.trim(),res=$('#res');if(!q)return;res.innerHTML='';
 const msg=t=>{const d=document.createElement('div');d.className='msg2';d.textContent=t;res.append(d)};
 try{
  const j=await(await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=${S.lang==='zh'?'zh,en':'en'}&countrycodes=cn,hk,tw,sg,my,id,th,kr,jp,vn&q=${encodeURIComponent(q)}`)).json();
  if(!j.length)return msg(L_().noRes);
  for(const r of j){
   const parts=(r.display_name||'').split(',').map(s=>s.trim());
   const b=document.createElement('button');b.textContent=parts[0]||q;
   const sm=document.createElement('small');sm.textContent=parts.slice(1,4).join(', ');b.append(sm);
   b.onclick=()=>{S.moved=true;flyTo(+r.lat,+r.lon,14,(parts[0]||q).slice(0,14));res.innerHTML='';closeSearch()};
   res.append(b);
  }
 }catch(e){msg(L_().geoE)}
}

/* ================= 找店 ================= */
async function load(c){
 const key=c.lat.toFixed(2)+','+c.lon.toFixed(2);
 if(S.pool&&S.poolKey===key)return;
 const ck='fan5:'+key;
 try{const x=JSON.parse(localStorage.getItem(ck)||'null');if(x&&Date.now()-x.ts<18e5){S.pool=x.pool;S.poolKey=key;S.seen.clear();return}}catch(e){}
 let pool=[];
 for(const r of [3000,5000]){pool=clean(await overpass(c.lat,c.lon,r),c.lat,c.lon,S.cc);if(pool.length>=10)break}
 S.pool=pool;S.poolKey=key;S.seen.clear();
 try{localStorage.setItem(ck,JSON.stringify({ts:Date.now(),pool}))}catch(e){}
}
function candidates(nearby){
 const meal=['restaurant','fast_food','food_court'];
 const base=S.pool.filter(p=>{
  if(S.seen.has(p.id)||(p.court&&p.hasStalls))return false;
  if(S.cats.size){if(!p.cats.some(c=>S.cats.has(c)))return false}else if(!meal.includes(p.t.amenity))return false;
  if(S.tier!=='all'&&tierOf(p.price)!==S.tier)return false;
  return true;
 }).map(p=>({p,st:openState(p.t.opening_hours)}));
 if(!nearby)return base;
 const open=base.filter(x=>x.st.s===true);
 return open.length?open:base.filter(x=>x.st.s===null);
}
async function find(){
 if(S.busy){S.token++;setBusy(false);showHint(null);firstHint();return}
 closePop();closeSearch();
 const tok=++S.token;setBusy(true);showHint('searching');
 const c=center();S.cc=ccNow();S.nearby=isNearby();S.fromName=S.placeName;refineCC(c);
 try{await load(c)}catch(e){if(tok===S.token)showErr('e2');return}
 if(tok!==S.token)return;
 const list=candidates(S.nearby);
 if(!list.length){const had=S.seen.size>0;S.seen.clear();return showErr(had?'e3':'e4')}
 const ch=pick(list.map(x=>x.p)),it=list.find(x=>x.p===ch);
 S.seen.add(ch.id);
 enterView();addSection(ch,it.st);
}
function nextOne(){
 if(S.printing||S.torn)return;
 const list=candidates(S.nearby);
 if(!list.length){S.seen.clear();toast(L_().e3[0]);return}
 const ch=pick(list.map(x=>x.p)),it=list.find(x=>x.p===ch);S.seen.add(ch.id);
 if(S.k>0)setK(0,false);
 addSection(ch,it.st);
}
function toast(t){const e=$('#toast');e.innerHTML='';const s=document.createElement('span');s.textContent=t;e.append(s);setTimeout(()=>{if(e.firstChild===s)e.innerHTML=''},2600)}

/* ================= 收据视图 ================= */
function zigStrings(){
 const n=21,top=[],bot=[];
 for(let i=0;i<=n;i++)top.push(`${i*12}px ${i%2?'0px':'6px'}`);
 for(let i=n;i>=0;i--)bot.push(`${i*12}px ${i%2?'100%':'calc(100% - 6px)'}`);
 const r=document.documentElement.style,sq='252px 100%,0 100%',sqt='0 0,252px 0';
 r.setProperty('--zt',`polygon(${top.join(',')},${sq})`);
 r.setProperty('--zb',`polygon(${sqt},${bot.join(',')})`);
 r.setProperty('--zz',`polygon(${top.join(',')},${bot.join(',')})`);
}
function enterView(){
 S.view=true;S.secs=[];S.k=0;S.torn=false;$('#strip').innerHTML='';
 $('#app').classList.add('view-on');$('#view').classList.remove('hide','torn');
 setBusy(false);showHint(null);refreshLeft();
}
function backToMap(){
 if(!S.view)return;
 S.view=false;S.secs=[];S.k=0;S.torn=false;S.printing=false;if(S.anim){try{S.anim.cancel()}catch(e){}}S.anim=null;
 $('#strip').innerHTML='';$('#strip').style.transform='';$('#app').classList.remove('view-on');$('#view').classList.add('hide');$('#view').classList.remove('torn','printing');
 $('#toast').innerHTML='';refreshLeft();firstHint();
}
const secH=()=>{const e=$('#strip .sec');return e?e.offsetHeight:480};
function setK(k,anim){S.k=k;const s=$('#strip');s.style.transition=anim?'transform .35s ease':'none';s.style.transform=`translateY(${k*secH()}px)`}
function distText(p){
 const l=L_(),d=p.dist,base=d<=1.2?l.walk(Math.max(1,Math.round(d*1000/80))):l.car(Math.max(2,Math.round(d/20*60)));
 if(S.nearby)return base;
 const nm=S.fromName||l.mapc;
 return S.lang==='zh'?`${l.from(nm)}${base}`:`${l.from(nm)}: ${base.charAt(0).toLowerCase()+base.slice(1)}`;
}
function hoursText(p,st){
 const l=L_();
 if(S.nearby){return st.s===true?(st.until?l.until(pad(st.until)):l.all24):l.unl}
 const hrs=todayHours(p.t.opening_hours);
 if(!hrs)return l.unl;if(hrs[0]==='24h')return l.all24;if(!hrs.length)return l.closed;
 return hrs.join(S.lang==='zh'?'，':', ');
}
function rowsOf(sd){
 const {p,st}=sd,l=L_(),zh=S.lang==='zh',k=p.kc&&K[p.kc],ds=p.dishId&&DM[p.dishId],r=[];
 const catLabel=()=>{const c=CATS.find(x=>p.cats&&p.cats.includes(x[0])&&['tea','coffee','dessert'].includes(x[0]));return c?(zh?c[1]:c[2]):null};
 let note=null;
 if(p.court){r.push([l.rCuisine,l.court],[l.rTry,l.queue])}
 else if(ds){r.push([l.rCuisine,k?(zh?k.z:k.e):(zh?ds.z:ds.e)]);if(k)r.push([l.rTry,zh?ds.z:ds.e])}
 else if(k){r.push([l.rCuisine,zh?k.z:k.e]);if(k.d)r.push([l.rTry,(zh?k.d[0]:k.d[1])+l.classic])}
 else if(catLabel())r.push([l.rCuisine,catLabel()]);
 else if(p.cu.length){const c=p.cu[0].replace(/_/g,' ');r.push([l.rCuisine,c.charAt(0).toUpperCase()+c.slice(1)])}
 else{r.push([l.rCuisine,l.unl]);note=l.noCuisine}
 r.push([l.rAddr,sd.addr||l.seeMap]);
 r.push([l.rPrice,l.pp+bandText(S.cc2||S.cc,tierOf(p.price),true)]);
 r.push([l.rDist,distText(p)]);
 r.push([l.rHours,hoursText(p,st)]);
 return{rows:r,note};
}
function buildSec(sd,idx){
 const nm=sd.names,{rows,note}=rowsOf(sd),art=artOf(sd.p);
 const w=document.createElement('div');w.className='secw';w.dataset.i=sd.no;
 const s=document.createElement('div');s.className='sec'+(idx===0?' zt':'');
 const h=document.createElement('div');h.className='rn';h.textContent=nm.main;
 const e=document.createElement('div');e.className='re';e.textContent=nm.second||'';
 const d1=document.createElement('div');d1.className='rd2';
 const ph=document.createElement('div');ph.className='rph';ph.style.background=art.bg;ph.innerHTML=art.svg;
 const d2=document.createElement('div');d2.className='rd2';
 s.append(h,e,d1,ph,d2);
 rows.forEach(([a,b],i)=>{const r=document.createElement('div');r.className='ri';const x=document.createElement('span');x.textContent=a;const f=document.createElement('i');const v=document.createElement('b');v.textContent=b;if(a===L_().rAddr)v.className='av';r.append(x,f,v);s.append(r)});
 if(note){const n=document.createElement('div');n.className='note';n.textContent=note;s.append(n)}
 const d3=document.createElement('div');d3.className='rd2';
 const bc=document.createElement('div');bc.className='bc';
 const no=document.createElement('div');no.className='rno';no.textContent='NO. '+String(sd.no).padStart(3,'0');
 const nv=document.createElement('button');nv.className='nva';nv.setAttribute('aria-label',L_().nav);
 nv.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L21 3l-8.5 18-2-7.5z" fill="#FAF6EA"/></svg>';
 nv.onclick=()=>openNav(sd.p.la,sd.p.lo);
 s.append(d3,bc,no,nv);w.append(s);return w;
}
function addSection(p,st){
 const sd={p,st,no:S.secs.length+1,names:namesOf(p.t),addr:initAddr(p)};
 S.secs.push(sd);
 const strip=$('#strip'),el=buildSec(sd,S.secs.length-1);
 strip.style.transition='none';strip.append(el);
 const H=secH();strip.style.transform=`translateY(${H}px)`;void strip.offsetHeight;
 S.k=0;S.printing=true;$('#view').classList.add('printing');
 const done=()=>{strip.style.transform='translateY(0px)';S.printing=false;$('#view').classList.remove('printing')};
 if(reduced()){done()}
 else{
  S.anim=strip.animate([{transform:`translateY(${H}px)`},{transform:'translateY(0px)'}],{duration:1200,easing:`steps(${Math.max(8,Math.round(H/30))},end)`,fill:'forwards'});
  S.anim.onfinish=()=>{done();try{S.anim.cancel()}catch(e){}};
 }
 enrich(sd);
}
async function enrich(sd){
 const lang=S.lang,upd=()=>{const w=document.querySelector(`#strip .secw[data-i="${sd.no}"]`);if(!w)return;
  const re=w.querySelector('.re');if(re)re.textContent=sd.names.second||'';const av=w.querySelector('.av');if(av)av.textContent=sd.addr||L_().seeMap};
 if(sd.names.needMT&&!sd.names.second){const tr=await translate(sd.names.main,lang);if(tr&&tr!==sd.names.main){sd.names.second=tr;upd()}}
 if(!sd.addr||nonCE(sd.addr)){const a=await resolveAddr(sd.p,lang);if(a){sd.addr=a;upd()}}
}
function rerender(){
 const strip=$('#strip'),t=strip.style.transform;strip.innerHTML='';
 S.secs.forEach((sd,i)=>{sd.names=namesOf(sd.p.t);sd.addr=initAddr(sd.p);strip.append(buildSec(sd,i));enrich(sd)});
 strip.style.transform=t;
 if(S.torn)tearApply(S.tornIdx);
}
function tearApply(idx){
 document.querySelectorAll('#strip .secw').forEach((w,i)=>{const s=w.firstElementChild;if(i===idx){s.classList.add('zt','zb')}else{w.style.opacity='0'}});
}
function tear(){
 if(S.torn||S.printing)return;
 S.torn=true;S.tornIdx=S.secs.length-1-S.k;$('#view').classList.add('torn');tearApply(S.tornIdx);
}
function openNav(lat,lon){
 const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(ios){
  let hidden=false;const onv=()=>{if(document.hidden)hidden=true};document.addEventListener('visibilitychange',onv);
  location.href=`comgooglemaps://?daddr=${lat},${lon}`;
  setTimeout(()=>{document.removeEventListener('visibilitychange',onv);if(!hidden)location.href=`https://maps.apple.com/?daddr=${lat},${lon}`},1500);
 }else window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`,'_blank','noopener');
}
/* 往下拉，看历史 */
(function(){
 const feed=$('#feed');let g=null;
 feed.addEventListener('pointerdown',e=>{
  if(S.printing){if(S.anim)try{S.anim.finish()}catch(x){}return}
  if(S.torn){if(e.target.id==='feed')backToMap();return}
  if(S.secs.length<2){if(e.target.id==='feed')backToMap();return}
  g={y:e.clientY,k:S.k,h:secH(),dy:0};try{feed.setPointerCapture(e.pointerId)}catch(x){}$('#strip').style.transition='none';
 });
 feed.addEventListener('pointermove',e=>{if(!g)return;g.dy=e.clientY-g.y;const max=(S.secs.length-1)*g.h;$('#strip').style.transform=`translateY(${Math.max(0,Math.min(max,g.k*g.h+g.dy))}px)`});
 const end=e=>{if(!g)return;const moved=Math.abs(g.dy)>6,max=(S.secs.length-1)*g.h,off=Math.max(0,Math.min(max,g.k*g.h+g.dy)),k=Math.round(off/g.h);g=null;setK(k,true);if(!moved&&e&&e.target&&e.target.id==='feed')backToMap()};
 feed.addEventListener('pointerup',end);feed.addEventListener('pointercancel',end);
})();

/* ================= 事件 ================= */
(function(){
 const disc=$('#disc');let lp=null,long=false,down=false,mode=false;
 const hit=e=>{for(const b of document.querySelectorAll('#pop .bub')){const r=b.getBoundingClientRect();if(e.clientX>=r.left-8&&e.clientX<=r.right+8&&e.clientY>=r.top-8&&e.clientY<=r.bottom+8)return b}return null};
 disc.addEventListener('pointerdown',e=>{
  if(S.busy)return;down=true;long=false;try{disc.setPointerCapture(e.pointerId)}catch(x){}
  lp=setTimeout(()=>{long=true;mode=true;openPop()},500);
 });
 disc.addEventListener('pointermove',e=>{if(!mode||!S.pop)return;const b=hit(e);document.querySelectorAll('#pop .bub').forEach(x=>x.classList.toggle('on',x===b))});
 disc.addEventListener('pointerup',e=>{
  clearTimeout(lp);
  if(S.busy&&!down){find();return}
  if(S.busy&&down&&!long){}
  if(long){const b=hit(e);mode=false;down=false;if(b)chooseTier(b.dataset.t);else document.querySelectorAll('#pop .bub').forEach(x=>x.classList.remove('on'));return}
  if(down){down=false;find()}
 });
 disc.addEventListener('pointercancel',()=>{clearTimeout(lp);down=false;mode=false});
 disc.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();find()}else if(e.key==='ArrowUp'){e.preventDefault();openPop()}});
 disc.addEventListener('contextmenu',e=>e.preventDefault());
 document.addEventListener('pointerdown',e=>{if(S.pop&&!e.target.closest('#pop')&&!e.target.closest('#disc'))closePop()},true);
 $('#left').onclick=()=>{if(S.view){backToMap()}else{$('#search').classList.contains('hide')?openSearch():closeSearch()}};
 $('#lang').onclick=()=>{S.lang=S.lang==='zh'?'en':'zh';try{localStorage.setItem('fan:lang',S.lang)}catch(e){}applyLang()};
 $('#dim').onclick=()=>{if(S.view)backToMap()};
 $('#go').onclick=doSearch;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
 $('#myloc').onclick=()=>{S.moved=false;if(S.gps)flyTo(S.gps.lat,S.gps.lon,13,null);else locate();$('#res').innerHTML='';closeSearch()};
 $('#done').onclick=closeSearch;
 $('#ok').onclick=tear;$('#nx').onclick=nextOne;$('#retry').onclick=find;
})();
function applyLang(){
 const l=L_();document.documentElement.lang=S.lang;document.title='翻翻 fanfan';
 $('#lang').textContent=S.lang==='zh'?'中 · EN':'EN · 中';
 $('#q').placeholder=l.ph;$('#go').textContent=l.go;$('#myloc').textContent='◎ '+l.myloc;$('#done').textContent=l.done;$('#fl').textContent=l.fl;$('#note').textContent=l.note;
 $('#ok').textContent=l.ok;$('#nx').textContent=l.nx;$('#disc').setAttribute('aria-label',S.lang==='zh'?'发现':'Discover');
 buildChips();refreshLeft();renderMsg();if(S.view)rerender();
}
zigStrings();applyTier();initMap();locate();applyLang();firstHint();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
